<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人名片</title>
    <style>
      /* 全局样式：统一页面背景与字体 */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #f3f5f7 0%, #e9eef5 100%);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        color: #2f3746;
      }

      /* 卡片容器：居中展示，圆角和阴影 */
      .card {
        width: 360px;
        padding: 30px 26px 24px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(31, 41, 55, 0.12);
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      /* 鼠标悬停时轻微上浮，阴影增强 */
      .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 32px rgba(31, 41, 55, 0.16);
      }

      /* 头像区域 */
      .avatar-wrap {
        margin-bottom: 18px;
      }

      .avatar {
        width: 96px;
        height: 96px;
        margin: 0 auto;
        border-radius: 50%;
        overflow: hidden;
        border: 3px solid #edf1f7;
        box-shadow: 0 6px 18px rgba(77, 97, 128, 0.15);
      }

      .avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* 姓名样式 */
      .name {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      /* 职位样式 */
      .job {
        display: inline-block;
        padding: 6px 14px;
        background: #eef3ff;
        color: #4d6bff;
        border-radius: 999px;
        font-size: 14px;
        margin-bottom: 22px;
      }

      /* 联系方式列表 */
      .contact {
        list-style: none;
        text-align: left;
      }

      .contact li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid #edf0f4;
        font-size: 14px;
        color: #475569;
      }

      .contact li:first-child {
        border-top: none;
      }

      /* 图标样式 */
      .icon {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f3f6fb;
        color: #5a6b87;
        font-size: 14px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="avatar-wrap">
        <div class="avatar">
          <img
            src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=300&q=80"
            alt="头像"
          />
        </div>
      </div>

      <h1 class="name">李明远</h1>
      <div class="job">前端开发工程师</div>

      <ul class="contact">
        <li>
          <span class="icon">☎</span>
          <span>+86 138 0000 0000</span>
        </li>
        <li>
          <span class="icon">✉</span>
          <span>limingyuan@example.com</span>
        </li>
        <li>
          <span class="icon">⌂</span>
          <span>上海 · 中国</span>
        </li>
      </ul>
    </div>
  </body>
</html>
